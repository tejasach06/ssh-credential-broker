[workspace]
resolver = "2"
members = [
    "crates/broker-proto",
    "crates/broker-core",
    "crates/brokerd",
    "crates/broker-ssh",
    "crates/brokerctl",
    "crates/broker-windows",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Tejas Acharya"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
libc = "0.2"
futures-util = { version = "0.3", features = ["sink"] }
