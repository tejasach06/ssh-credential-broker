name: Native Windows
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_workstation:
        description: Also verify the local Windows runner without installing broker services
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check warnings
        run: cargo clippy --locked --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Run native tests
        run: cargo test --locked --workspace --all-targets --target x86_64-pc-windows-msvc
      - name: Stop image-provided OpenSSH service
        run: |
          $service = Get-Service -Name sshd -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Stopped') {
            Stop-Service -Name sshd -Force
            $service.WaitForStatus('Stopped', [TimeSpan]::FromSeconds(15))
          }
      - name: Build native release binaries
        run: cargo build --locked --workspace --release --target x86_64-pc-windows-msvc
      - name: Run isolated native SSH smoke
        run: ./scripts/smoke-windows.ps1 -CreateDisposableAccounts -BinDirectory ./target/x86_64-pc-windows-msvc/release -DisposableMachine -ProvisionLocalSshFixture
      - name: Package native installation
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release/package/bin -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/ssh-brokerd.exe,target/x86_64-pc-windows-msvc/release/broker-ssh.exe,target/x86_64-pc-windows-msvc/release/brokerctl.exe release/package/bin/
          Copy-Item scripts,deploy,README.md,SECURITY.md,CHANGELOG.md release/package/ -Recurse
          Compress-Archive -Path release/package/* -DestinationPath release/ssh-credential-broker-Windows-x86_64.zip
          $hash = (Get-FileHash release/ssh-credential-broker-Windows-x86_64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ssh-credential-broker-Windows-x86_64.zip" | Set-Content -Encoding ascii release/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: native-Windows-X64
          path: |
            release/*.zip
            release/SHA256SUMS
          if-no-files-found: error

  workstation:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_workstation
    runs-on: [self-hosted, Windows, X64, windows-workstation]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"
    steps:
      - uses: actions/checkout@v5
      - name: Expose installed Git Bash and GNU tools
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in @('C:/Program Files/Git/bin/bash.exe', 'C:/mingw64/bin/gcc.exe')) {
            if (-not (Test-Path $tool)) { throw "Required workstation tool missing: $tool" }
          }
          @('C:/Program Files/Git/bin', 'C:/Program Files/Git/usr/bin', 'C:/mingw64/bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding ascii -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
      - name: Verify native Windows client build and tests
        run: |
          cargo test --locked --workspace --all-targets --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --workspace --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/x86_64-pc-windows-gnu/debug/broker-ssh.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/x86_64-pc-windows-gnu/debug/brokerctl.exe --help
          exit $LASTEXITCODE
