name: VM101 container builds
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vm101:
    name: Linux build and Windows GNU cross-compile
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, vm101, podman]
    concurrency:
      group: vm101-broker-build
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check warnings
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run Linux tests
        run: cargo test --locked --workspace --all-targets
      - name: Build Linux release binaries
        run: cargo build --locked --workspace --release --bins
      - name: Cross-compile Windows GNU release binaries
        run: cargo build --locked --workspace --release --bins --target x86_64-pc-windows-gnu
      - name: Package Linux installation
        run: |
          mkdir -p release/linux/bin
          cp target/release/ssh-brokerd target/release/broker-ssh target/release/brokerctl release/linux/bin/
          cp -R scripts deploy README.md SECURITY.md CHANGELOG.md release/linux/
          tar -czf release/ssh-credential-broker-Linux-x86_64.tar.gz -C release/linux .
          cd release && sha256sum ssh-credential-broker-Linux-x86_64.tar.gz > SHA256SUMS-linux.txt
      - name: Package Windows GNU installation
        run: |
          mkdir -p release/windows/bin
          cp target/x86_64-pc-windows-gnu/release/ssh-brokerd.exe target/x86_64-pc-windows-gnu/release/broker-ssh.exe target/x86_64-pc-windows-gnu/release/brokerctl.exe release/windows/bin/
          cp -R scripts deploy README.md SECURITY.md CHANGELOG.md release/windows/
          tar -czf release/ssh-credential-broker-Windows-x86_64-gnu.tar.gz -C release/windows .
          cd release && sha256sum ssh-credential-broker-Windows-x86_64-gnu.tar.gz > SHA256SUMS-windows.txt
      - name: Upload Linux archive and checksum
        uses: actions/upload-artifact@v7
        with:
          name: release-Linux-x86_64-vm101
          path: |
            release/ssh-credential-broker-Linux-x86_64.tar.gz
            release/SHA256SUMS-linux.txt
          if-no-files-found: error
      - name: Upload Windows GNU archive and checksum
        uses: actions/upload-artifact@v7
        with:
          name: release-Windows-x86_64-gnu-vm101
          path: |
            release/ssh-credential-broker-Windows-x86_64-gnu.tar.gz
            release/SHA256SUMS-windows.txt
          if-no-files-found: error
