[package]
name = "brokerctl"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
broker-proto = { path = "../broker-proto" }
clap.workspace = true
tokio.workspace = true
serde_json.workspace = true
zeroize.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
broker-windows = { path = "../broker-windows" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
